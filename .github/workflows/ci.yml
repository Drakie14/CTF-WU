# Kiểm tra mỗi lần push/PR: lint, type check, test, build. Build có cảnh báo (frontmatter sai, ảnh hỏng,
# markdown lạ...) cũng tính là lỗi, vì những lỗi đó không làm `astro build` fail mà chỉ in ra log.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Dùng Chromium có sẵn, chỉ cài nếu thiếu
        run: |
          browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          if [ ! -x "$browser_path" ]; then
            browser_path="$(command -v google-chrome || command -v chromium || true)"
          fi
          if [ -z "$browser_path" ]; then
            npx playwright install --with-deps chromium --no-shell
            browser_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-reports
          path: |
            test-results/
            .lighthouseci/reports/
